<h1>Liste des expeditions</h1>
<p><a href="{% url 'expeditions:ajouter' %}">Ajouter une expedition</a></p>
<ul>
  {% for expedition in liste %}
    <li><a href="{% url 'expeditions:detail-reference' expedition.reference %}">{{ expedition.reference }}</a></li>
  {% empty %}
    <li>Aucune expedition disponible pour le moment.</li>
  {% endfor %}
</ul>
