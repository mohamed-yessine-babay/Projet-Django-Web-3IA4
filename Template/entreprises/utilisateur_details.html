{% extends "base.html" %}
{% block title %}{{ object }} | CargoFlow{% endblock %}
{% block content %}
<h1>{{ object }}</h1>
<p>Nom: {{ object.username }}</p>
<p>Email: {{ object.email }}</p>
<p>Telephone: {{ object.telephone }}</p>
<p>Role: {{ object.get_role_display }}</p>
<p class="actions"><a class="button" href="{% url 'entreprises:utilisateur-modifier' object.pk %}">Modifier</a><a class="button button-danger" href="{% url 'entreprises:utilisateur-supprimer' object.pk %}">Supprimer</a></p>
{% endblock %}
