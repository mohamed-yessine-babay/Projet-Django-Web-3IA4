{% extends "base.html" %}
{% block title %}Inscription | CargoFlow{% endblock %}
{% block content %}
<h1>Créer un compte</h1>
<p>Inscrivez-vous pour accéder à la gestion des opérations logistiques.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Créer mon compte</button>
</form>
<p>Vous avez déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
{% endblock %}
